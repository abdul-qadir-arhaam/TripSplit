version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trip_finance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trip_user
      POSTGRES_PASSWORD: trip_password
      POSTGRES_DB: trip_finance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
